<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071022"/>
      <stop offset="55%" stop-color="#0b1f2e"/>
      <stop offset="100%" stop-color="#0e2f33"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fileFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- faint system grid -->
  <g stroke="#1e3a45" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <circle cx="960" cy="120" r="260" fill="url(#glow)"/>

  <!-- diagonal cleaning sweep -->
  <g>
    <polygon points="700,-20 1220,-20 1000,380 480,380" fill="url(#sweep)"/>
  </g>

  <!-- scattered "temp files" being swept away, fading right -->
  <g>
    <g transform="translate(760,70) rotate(12)">
      <path d="M0,0 H34 L44,10 V50 H0 Z" fill="url(#fileFade)"/>
      <path d="M34,0 L44,10 H34 Z" fill="#e0f2fe" opacity="0.6"/>
    </g>
    <g transform="translate(840,120) rotate(-8)">
      <path d="M0,0 H30 L40,10 V46 H0 Z" fill="url(#fileFade)"/>
      <path d="M30,0 L40,10 H30 Z" fill="#e0f2fe" opacity="0.5"/>
    </g>
    <g transform="translate(920,60) rotate(20)">
      <path d="M0,0 H26 L34,8 V40 H0 Z" fill="url(#fileFade)"/>
    </g>
    <g transform="translate(1000,150) rotate(-15)">
      <path d="M0,0 H24 L32,8 V38 H0 Z" fill="url(#fileFade)"/>
    </g>
    <g transform="translate(1070,90) rotate(30)">
      <path d="M0,0 H20 L26,6 V32 H0 Z" fill="url(#fileFade)"/>
    </g>
  </g>

  <!-- dissolving particles / cleaned dust trail -->
  <g fill="#5eead4">
    <circle cx="1050" cy="200" r="4" opacity="0.7"/>
    <circle cx="1080" cy="230" r="3" opacity="0.55"/>
    <circle cx="1105" cy="180" r="2.5" opacity="0.4"/>
    <circle cx="1000" cy="250" r="3.5" opacity="0.5"/>
    <circle cx="1125" cy="140" r="2" opacity="0.35"/>
    <circle cx="960" cy="260" r="2.5" opacity="0.45"/>
    <circle cx="1140" cy="200" r="1.8" opacity="0.3"/>
    <circle cx="920" cy="290" r="2" opacity="0.3"/>
  </g>

  <!-- broom-like swoosh line accent -->
  <path d="M470,300 C620,230 780,260 1140,120" stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M470,300 C620,230 780,260 1140,120" stroke="#5eead4" stroke-width="1" fill="none" opacity="0.8"/>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700" fill="url(#txt)" textLength="620" lengthAdjust="spacingAndGlyphs">Temp File Cleaner</text>

  <!-- tagline -->
  <text x="60" y="210" font-family="'Segoe UI', Arial, sans-serif" fill="#c7f9f1" opacity="0.9" textLength="1080.0" lengthAdjust="spacingAndGlyphs" font-size="15.8">Temp File Cleaner (TFC) is a utility program for Microsoft Windows designed to quickly remove temporary and u…</text>

  <!-- subtitle accent line -->
  <rect x="60" y="240" width="140" height="4" rx="2" fill="#5eead4" opacity="0.8"/>
  <text x="60" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#7dd3c0" opacity="0.85">Fast scan · Multiple locations · One-click cleanup</text>
</svg>